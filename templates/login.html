<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Siddhanth Firm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">

  <!-- Flash messages outside card -->
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-global" style="position:fixed;top:20px;right:20px;z-index:999;min-width:280px">
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}">
      {{ message }}
      <button class="flash-close" onclick="this.parentElement.remove()">×</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <div class="login-bg">
    <!-- Floating particles -->
    <div class="login-particles">
      <div class="particle p1"></div>
      <div class="particle p2"></div>
      <div class="particle p3"></div>
      <div class="particle p4"></div>
      <div class="particle p5"></div>
      <div class="particle p6"></div>
    </div>

    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo">💎</div>
          <h1 class="login-title">Siddhanth Firm</h1>
          <p class="login-subtitle">Business Management System</p>
        </div>

        <form class="login-form" method="POST" action="{{ url_for('login') }}" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="email" name="email" class="form-input" required placeholder="admin@siddhanth.com"
                autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" name="password" class="form-input" required
                placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="toggle-password" onclick="togglePwd()"
                title="Show/hide password">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text">Sign In</span>
          </button>
        </form>

        <div class="login-hint">
          <small>Default: admin@siddhanth.com / Admin@123</small>
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePwd() {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }
    document.getElementById('loginForm').addEventListener('submit', function () {
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<span class="spinner"></span> Signing in…';
      btn.disabled = true;
    });
  </script>
</body>

</html>
